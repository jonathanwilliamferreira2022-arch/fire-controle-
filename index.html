'use strict';const KEY='fire-finance-v1';let db={events:[]},view='home',eventId=null,tab='overview';const $=s=>document.querySelector(s);const uid=()=>('id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=v=>Number(String(v??'').replace(',','.'))||0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=d=>d?d.split('-').reverse().join('/'):'—';const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};function save(){try{localStorage.setItem(KEY,JSON.stringify(db));if(localStorage.getItem(KEY)!==JSON.stringify(db))throw Error('Gravação não confirmada');return true}catch(e){alert('ATENÇÃO: este navegador não permitiu salvar os dados permanentemente. O evento continua visível nesta sessão, mas você deve usar Backup > Exportar backup antes de fechar. Abra o arquivo no Chrome, fora da pré-visualização do aplicativo.');return false}}try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.events))db=d}catch(e){}function evt(){return db.events.find(e=>e.id===eventId)}function sum(a){return a.reduce((s,x)=>s+x,0)}function amounts(e,structureId){let t=e.entries.filter(x=>!structureId||x.structureId===structureId),sales=t.filter(x=>x.type==='sale'),expenses=t.filter(x=>x.type==='expense'),cash=sum(sales.filter(x=>x.method==='Dinheiro').map(x=>x.amount)),pix=sum(sales.filter(x=>x.method==='Pix').map(x=>x.amount)),debit=sum(sales.filter(x=>x.method==='Débito').map(x=>x.amount)),credit=sum(sales.filter(x=>x.method==='Crédito').map(x=>x.amount)),card=sum(sales.filter(x=>['Cartão','Débito','Crédito'].includes(x.method)).map(x=>x.amount)),gross=cash+pix+card,cost=sum(expenses.map(x=>x.amount)),fee=card*num(e.fee)/100;return{cash,pix,debit,credit,card,gross,cost,fee,net:gross-fee,profit:gross-fee-cost}}function go(v,id){view=v;if(id)eventId=id;tab='overview';render();window.scrollTo(0,0)}function render(){const a=$('#app');if(view==='home'){let active=db.events.filter(e=>!e.closed&&!e.canceled).length;let total=sum(db.events.filter(e=>!e.canceled).map(e=>amounts(e).profit));a.innerHTML=`<section class="panel hero"><h1>🔥 FIRE CONTROLE</h1><p>Financeiro de Eventos</p><p>Trailers • Barracas • Vendas • Despesas</p></section><div class="grid"><button onclick="go('events')">📅 Eventos (${db.events.length})</button><button onclick="go('new')">➕ Novo evento</button><button onclick="go('reports')">📊 Relatórios</button><button onclick="go('backup')">💾 Backup</button></div><section class="panel"><h2>Visão geral</h2><div class="grid"><div class="stat"><small>Eventos em andamento</small><b>${active}</b></div><div class="stat"><small>Resultado acumulado</small><b>${money(total)}</b></div></div></section><p class="notice">⚠️ O aplicativo tenta salvar neste navegador e neste aparelho. Em visualizadores de arquivos, o salvamento pode ser bloqueado. Exporte um backup regularmente, especialmente antes de limpar os dados do navegador ou trocar de celular.</p>`;return}
if(view==='events'){a.innerHTML=`<div class="row"><h2>Eventos</h2><button onclick="go('new')">+ Novo</button></div><button class="secondary" onclick="go('home')">← Início</button>${db.events.length?db.events.slice().sort((x,y)=>String(y.start).localeCompare(String(x.start))).map(e=>`<section class="panel" onclick="go('event','${e.id}')" style="cursor:pointer"><div class="row"><div><b>${esc(e.name)}</b><p class="muted">${fmtDate(e.start)} a ${fmtDate(e.end)} • ${esc(e.place||'Local não informado')}</p></div><span class="tag ${e.closed||e.canceled?'closed':''}">${e.canceled?'Cancelado':e.closed?'Finalizado':'Em andamento'}</span></div><div class="row"><small>Resultado</small><b class="money">${money(amounts(e).profit)}</b></div></section>`).join(''):'<div class="empty">Nenhum evento cadastrado ainda.</div>'}`;return}
if(view==='new'){a.innerHTML=`<button class="secondary" onclick="go('events')">← Eventos</button><section class="panel"><h2>Novo evento</h2><p class="notice">Para testar o salvamento: cadastre um evento, volte à lista de eventos e abra-o novamente. Antes de sair, exporte um backup.</p><div id="newform"><label>Nome do evento<input name="name" required placeholder="Ex.: Rodeio Regional"></label><label>Local<input name="place" placeholder="Cidade ou local"></label><div class="grid"><label>Data de início<input type="date" name="start" value="${today()}" required></label><label>Data de término<input type="date" name="end" value="${today()}" required></label></div><div class="panel"><b>Selecione as estruturas do evento</b><p class="muted">Marque uma ou mais opções:</p>${['FOOD Vermelho','FOOD Preto','FOOD Batata','FOOD Chopp'].map(n=>`<label style="display:flex;align-items:center;gap:12px;padding:10px 2px"><input type="checkbox" name="structureChoice" value="${n}" ${n==='FOOD Vermelho'?'checked':''} style="width:22px;height:22px;flex-shrink:0"> ${n}</label>`).join('')}</div><button type="button" class="wide green" onclick="registerFireEvent()">✓ Salvar evento</button><p id="saveStatus" class="notice" role="status"></p></div></section>`;return}
if(view==='event'){let e=evt();if(!e){go('events');return}let m=amounts(e);a.innerHTML=`<button class="secondary no-print" onclick="go('events')">← Eventos</button><section class="panel"><div class="row"><div><h2>${esc(e.name)}</h2><div class="muted">${fmtDate(e.start)} a ${fmtDate(e.end)} • ${esc(e.place)}</div></div><span class="tag ${e.closed||e.canceled?'closed':''}">${e.canceled?'Cancelado':e.closed?'Finalizado':'Em andamento'}</span></div><div class="spaced no-print"><button class="${e.canceled?'secondary':'danger'}" onclick="toggleCancel()">${e.canceled?'↩ Restaurar evento':'✖ Cancelar evento'}</button></div>${e.canceled?'<p class="notice">Evento cancelado: preservado no histórico, fora dos relatórios e bloqueado para novos lançamentos.</p>':''}</section><div class="tabs no-print">${[['overview','Visão geral'],['daily','Fechamento diário'],['expense','+ Despesa'],['entries','Movimentações'],['close','Fechamento geral']].map(([k,n])=>`<button class="${tab===k?'selected':'secondary'}" onclick="setTab('${k}')">${n}</button>`).join('')}</div><div id="detail"></div>`;renderTab();return}
if(view==='reports'){let all=db.events.filter(e=>!e.canceled).map(e=>({e,m:amounts(e)}));a.innerHTML=`<button class="secondary" onclick="go('home')">← Início</button><section class="panel"><h2>Relatório de eventos</h2><div class="grid"><div class="stat"><small>Faturamento bruto</small><b>${money(sum(all.map(x=>x.m.gross)))}</b></div><div class="stat"><small>Despesas + taxas</small><b>${money(sum(all.map(x=>x.m.cost+x.m.fee)))}</b></div></div><h3>Resultado geral: <span class="money">${money(sum(all.map(x=>x.m.profit)))}</span></h3>${all.map(({e,m})=>`<div class="item"><div class="row"><b>${esc(e.name)}</b><b>${money(m.profit)}</b></div><small>${fmtDate(e.start)} • ${e.closed?'Finalizado':'Em andamento'}</small><p><button class="secondary" onclick="go('event','${e.id}')">Abrir evento</button></p></div>`).join('')||'<p>Sem eventos.</p>'}</section>`;return}
if(view==='backup'){a.innerHTML=`<button class="secondary" onclick="go('home')">← Início</button><section class="panel"><h2>💾 Backup e restauração</h2><p>Faça uma cópia dos dados e guarde no Google Drive, em outra pasta ou envie para você mesmo.</p><button class="wide green" onclick="exportData()">⬇ Exportar backup JSON</button><h3>Restaurar backup</h3><p class="muted">A restauração substitui todos os eventos deste navegador pelos dados do arquivo escolhido.</p><input id="importFile" type="file" accept="application/json,.json"><button class="wide danger" onclick="importData()">Restaurar arquivo selecionado</button></section><section class="panel"><h3>Uso offline</h3><p>Este arquivo HTML funciona sem internet depois de salvo no aparelho. Os dados ficam no armazenamento do navegador que abrir o arquivo; dependendo do navegador, arquivos locais podem ter restrições de persistência. Faça backup após cada evento.</p></section>`;return}}
function setTab(t){tab=t;render()}function renderTab(){let e=evt(),m=amounts(e),d=$('#detail');if(tab==='overview'){d.innerHTML=`<div class="grid"><div class="stat"><small>Vendas brutas</small><b>${money(m.gross)}</b></div><div class="stat"><small>Despesas</small><b>${money(m.cost)}</b></div><div class="stat"><small>Taxa cartão</small><b>${money(m.fee)}</b></div><div class="stat"><small>Resultado</small><b class="money">${money(m.profit)}</b></div></div><section class="panel"><h2>Estruturas do evento</h2>${e.structures.map(s=>{let v=amounts(e,s.id);return`<div class="item"><div class="row"><b>🚚 ${esc(s.name)}</b><b class="money">${money(v.profit)}</b></div><small>Vendas: ${money(v.gross)} • Despesas: ${money(v.cost)} • Taxa: ${money(v.fee)}</small></div>`}).join('')}<button class="secondary spaced" onclick="addStructure()">+ Adicionar estrutura</button></section><div class="grid no-print"><button class="green" onclick="setTab('daily')">💰 Fechamento diário</button><button onclick="setTab('expense')">+ Lançar despesa</button></div>`;return}
if(tab==='daily'){let ds=e.entries.filter(x=>x.dailyClosure),dates=[...new Set(ds.map(x=>x.date+'|'+x.structureId))].sort().reverse();d.innerHTML=`<section class="panel"><h2>💰 Fechamento diário</h2><p class="muted">Informe apenas os totais recebidos no dia, por estrutura. Um novo salvamento da mesma data e estrutura substitui o fechamento anterior.</p>${e.closed||e.canceled?'<p class="notice">Evento finalizado ou cancelado. Reabra ou restaure para editar.</p>':''}<div id="dailyform"><label>Data<input type="date" name="date" value="${today()}" required></label><label>FOOD<select name="structureId" required>${e.structures.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>💵 Dinheiro (R$)<input name="cash" type="number" min="0" step="0.01" value="0" required></label><label>💳 Débito (R$)<input name="debit" type="number" min="0" step="0.01" value="0" required></label><label>💳 Crédito (R$)<input name="credit" type="number" min="0" step="0.01" value="0" required></label><label>📱 Pix (R$)<input name="pix" type="number" min="0" step="0.01" value="0" required></label><button type="button" class="wide green" onclick="saveFireDailyClosure()" ${e.closed||e.canceled?'disabled':''}>✓ Salvar fechamento diário</button><p id="dailyStatus" class="notice" role="status"></p></div></section><section class="panel"><h3>Fechamentos já registrados</h3>${dates.map(key=>{let [date,id]=key.split('|'),st=e.structures.find(x=>x.id===id),rows=ds.filter(x=>x.date===date&&x.structureId===id),tot=sum(rows.map(x=>x.amount));return `<div class="item"><div class="row"><b>${fmtDate(date)} • ${esc(st?.name||'FOOD')}</b><b>${money(tot)}</b></div><small>${['Dinheiro','Débito','Crédito','Pix'].map(method=>method+': '+money(sum(rows.filter(x=>x.method===method).map(x=>x.amount)))).join(' • ')}</small></div>`}).join('')||'<p class="muted">Nenhum fechamento diário ainda.</p>'}</section>`;return}
if(tab==='sale'||tab==='expense'){let sale=tab==='sale';d.innerHTML=`<section class="panel"><h2>${sale?'Registrar venda':'Registrar despesa'}</h2>${e.closed||e.canceled?'<p class="notice">Evento finalizado ou cancelado. Reabra ou restaure para lançar movimentações.</p>':''}<form id="entryform"><label>Data<input name="date" type="date" value="${today()}" required></label><label>Trailer ou barraca<select name="structureId" required>${e.structures.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label>Valor (R$)<input name="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></label>${sale?`<label>Forma de pagamento<select name="method"><option>Dinheiro</option><option>Pix</option><option>Débito</option><option>Crédito</option></select></label>`:`<label>Categoria<select name="category"><option>Mercadorias</option><option>Funcionários</option><option>Transporte</option><option>Combustível</option><option>Taxas e aluguel</option><option>Outros</option></select></label>`}<label>Descrição<input name="description" placeholder="Opcional"></label><button type="button" class="wide ${sale?'green':''}" onclick="saveFireEntry()" ${e.closed||e.canceled?'disabled':''}>Salvar ${sale?'venda':'despesa'}</button><p id="entryStatus" class="notice" role="status"></p></form></section>`;return}
if(tab==='entries'){let arr=e.entries.slice().sort((x,y)=>String(y.date).localeCompare(String(x.date)));d.innerHTML=`<section class="panel"><h2>Movimentações (${arr.length})</h2>${arr.map(x=>{let s=e.structures.find(z=>z.id===x.structureId);return`<div class="item"><div class="row"><b>${x.type==='sale'?'🟢 Venda':'🔴 Despesa'}</b><b class="${x.type==='expense'?'negative':'money'}">${x.type==='expense'?'- ':''}${money(x.amount)}</b></div><div class="muted">${fmtDate(x.date)} • ${esc(s?.name||'Estrutura removida')} • ${esc(x.method||x.category||'')}</div><div class="row"><small>${esc(x.description)}</small><button class="danger no-print" ${e.closed||e.canceled?'disabled':''} onclick="deleteEntry('${x.id}')">Excluir</button></div></div>`}).join('')||'<p class="empty">Nenhum lançamento registrado.</p>'}</section>`;return}
if(tab==='close'){d.innerHTML=`<section class="panel"><h2>Fechamento geral do evento</h2><div class="item row"><span>Dinheiro</span><b>${money(m.cash)}</b></div><div class="item row"><span>Pix</span><b>${money(m.pix)}</b></div><div class="item row"><span>Débito</span><b>${money(m.debit)}</b></div><div class="item row"><span>Crédito</span><b>${money(m.credit)}</b></div>${m.card>m.debit+m.credit?`<div class="item row"><span>Cartão (lançamentos antigos)</span><b>${money(m.card-m.debit-m.credit)}</b></div>`:""}<div class="item row"><span>Vendas brutas</span><b>${money(m.gross)}</b></div><label class="spaced">Taxa dos cartões — débito + crédito (%)<input id="feeInput" type="number" step="0.01" min="0" max="100" value="${esc(e.fee)}" ${e.closed||e.canceled?'disabled':''}></label><button class="secondary wide no-print" onclick="updateFee()" ${e.closed||e.canceled?'disabled':''}>Aplicar porcentagem</button><div class="item row"><span>Desconto da taxa (sobre débito + crédito)</span><b class="negative">− ${money(m.fee)}</b></div><div class="item row"><span>Vendas líquidas</span><b>${money(m.net)}</b></div><div class="item row"><span>Despesas</span><b class="negative">− ${money(m.cost)}</b></div><div class="item row"><strong>RESULTADO FINAL</strong><strong class="money">${money(m.profit)}</strong></div><h3>Por estrutura</h3>${e.structures.map(s=>{let v=amounts(e,s.id);return`<div class="item row"><span>${esc(s.name)}</span><b>${money(v.profit)}</b></div>`}).join('')}<div class="grid no-print spaced"><button class="secondary" onclick="window.print()">🖨 Imprimir / PDF</button><button class="${e.closed?'gold':'green'}" onclick="prepareFireClose()">${e.closed?'Reabrir evento':'Finalizar evento'}</button></div><p id="closeStatus" class="notice" role="status"></p></section>`;return}}
function registerFireEvent(){try{const root=document.getElementById('newform');const get=n=>root.querySelector('[name="'+n+'"]')?.value||'';const name=get('name').trim(),start=get('start'),end=get('end'),names=Array.from(root.querySelectorAll('[name=structureChoice]:checked')).map(x=>x.value);const status=document.getElementById('saveStatus');if(!name){status.textContent='⚠️ Preencha o nome do evento.';status.scrollIntoView({block:'center'});return}if(!start||!end){status.textContent='⚠️ Preencha as duas datas.';status.scrollIntoView({block:'center'});return}if(end<start){status.textContent='⚠️ A data final não pode ser anterior à inicial.';status.scrollIntoView({block:'center'});return}if(!names.length){status.textContent='⚠️ Selecione uma estrutura FOOD antes de salvar.';status.scrollIntoView({block:'center'});return}const e={id:uid(),name,place:get('place').trim(),start,end,structures:names.map(name=>({id:uid(),name})),entries:[],fee:0,closed:false,canceled:false};db.events.push(e);const stored=save();go('event',e.id);if(!stored)alert('Evento criado nesta sessão, mas o navegador bloqueou o salvamento permanente. Faça um backup em Backup > Exportar backup.')}catch(err){const status=document.getElementById('saveStatus');if(status){status.textContent='Erro ao cadastrar: '+err.message;status.scrollIntoView({block:'center'})}alert('Erro ao cadastrar: '+err.message)}}

function saveFireEntry(){
 const status=document.getElementById('entryStatus');
 try{
  const e=evt(),root=document.getElementById('entryform');
  if(!e||!root)throw Error('Abra novamente o evento e a aba de despesas.');
  if(e.closed||e.canceled)throw Error('Este evento está finalizado ou cancelado.');
  const get=n=>root.querySelector('[name="'+n+'"]')?.value;
  const date=get('date'),structureId=get('structureId'),raw=get('amount');
  const amount=Number(String(raw??'').replace(',','.'));
  if(!date)throw Error('Escolha a data da despesa.');
  if(!structureId||!e.structures.some(x=>x.id===structureId))throw Error('Selecione o FOOD.');
  if(!Number.isFinite(amount)||amount<=0)throw Error('Informe um valor maior que zero.');
  const sale=tab==='sale';
  const entry={id:uid(),type:sale?'sale':'expense',date,structureId,amount,method:sale?get('method'):null,category:sale?null:get('category'),description:String(get('description')||'')};
  e.entries.push(entry);
  const stored=save();
  setTab('entries');
  alert((sale?'Venda':'Despesa')+' registrada: '+money(amount)+'. '+(stored?'Dados gravados no navegador.':'Armazenamento bloqueado: exporte um backup.'));
 }catch(err){if(status)status.textContent='⚠️ '+err.message;alert('Não foi possível salvar: '+err.message)}
}
function saveFireDailyClosure(){
 const status=document.getElementById('dailyStatus');
 try{
  const e=evt(),root=document.getElementById('dailyform');
  if(!e||!root)throw Error('Abra o evento e o fechamento diário novamente.');
  if(e.closed||e.canceled)throw Error('Este evento está finalizado ou cancelado.');
  const get=n=>root.querySelector('[name="'+n+'"]')?.value;
  const date=get('date'),structureId=get('structureId');
  const vals=[['Dinheiro',get('cash')],['Débito',get('debit')],['Crédito',get('credit')],['Pix',get('pix')]].map(([method,value])=>[method,Number(value)]);
  if(!date||!structureId||!e.structures.some(x=>x.id===structureId))throw Error('Escolha a data e o FOOD.');
  if(vals.some(([method,v])=>!Number.isFinite(v)||v<0))throw Error('Preencha os quatro valores com números iguais ou maiores que zero.');
  const old=e.entries.filter(x=>x.dailyClosure&&x.date===date&&x.structureId===structureId);
  if(old.length&&!confirm('Já existe um fechamento para essa data e FOOD. Substituir os valores anteriores?'))return;
  const other=e.entries.some(x=>x.type==='sale'&&!x.dailyClosure&&x.date===date&&x.structureId===structureId);
  if(other&&!confirm('Há vendas individuais nessa data e FOOD. Elas continuarão somadas. Deseja continuar?'))return;
  e.entries=e.entries.filter(x=>!(x.dailyClosure&&x.date===date&&x.structureId===structureId));
  for(const [method,amount] of vals)e.entries.push({id:uid(),type:'sale',dailyClosure:true,date,structureId,amount,method,category:null,description:'Fechamento diário'});
  const stored=save();
  setTab('daily');
  const total=vals.reduce((t,x)=>t+x[1],0);
  const msg='✓ Fechamento registrado: '+money(total)+'. '+(stored?'Dados gravados no navegador.':'ATENÇÃO: armazenamento bloqueado; exporte backup.');
  const next=document.getElementById('dailyStatus');if(next)next.textContent=msg;
  alert(msg);
 }catch(err){if(status)status.textContent='⚠️ '+err.message;alert('Não foi possível salvar: '+err.message)}
}
function addStructure(){let e=evt();if(e.closed||e.canceled)return alert('Reabra ou restaure o evento para editar.');let name=prompt('Nome do trailer ou barraca:');if(name&&name.trim()){e.structures.push({id:uid(),name:name.trim()});save();render()}}function deleteEntry(id){let e=evt();if(e.closed||e.canceled)return;if(confirm('Excluir este lançamento?')){e.entries=e.entries.filter(x=>x.id!==id);save();render()}}function updateFee(){let e=evt();if(e.closed||e.canceled)return;let v=num($('#feeInput').value);if(v<0||v>100)return alert('Informe uma taxa de 0% a 100%.');e.fee=v;save();render()}function toggleCancel(){let e=evt();if(!e)return;const message=e.canceled?'Restaurar este evento e permitir novas alterações?':'Cancelar este evento? Ele permanecerá no histórico, mas não entrará nos totais dos relatórios. Você poderá restaurá-lo depois.';if(!confirm(message))return;e.canceled=!e.canceled;save();render()}function prepareFireClose(){
 const e=evt();if(!e)return alert('Evento não encontrado.');
 const status=document.getElementById('closeStatus');
 if(e.canceled){if(status)status.textContent='Restaure o evento cancelado antes de finalizar.';return;}
 const button=document.querySelector('#detail button[onclick="prepareFireClose()"]');
 if(!button)return;
 const action=e.closed?'reabrir':'finalizar';
 button.textContent=action==='finalizar'?'✓ Confirmar finalização':'✓ Confirmar reabertura';
 button.setAttribute('onclick',`confirmFireClose('${e.id}', '${action}')`);
 if(status)status.textContent=action==='finalizar'?'Confirme para finalizar o evento e bloquear novos lançamentos.':'Confirme para reabrir o evento e permitir novos lançamentos.';
}
function confirmFireClose(id,action){
 try{
 const e=db.events.find(x=>x.id===id);if(!e)throw Error('Evento não encontrado.');
 if(e.canceled)throw Error('O evento está cancelado. Restaure antes.');
 e.closed=(action==='finalizar');
 const stored=save();
 render();
 const status=document.getElementById('closeStatus');
 if(status)status.textContent=(e.closed?'✓ Evento finalizado com sucesso!':'✓ Evento reaberto com sucesso!')+(stored?'':' ATENÇÃO: faça backup, o navegador bloqueou o armazenamento.');
 }catch(err){const status=document.getElementById('closeStatus');if(status)status.textContent='Erro: '+err.message;else alert('Erro: '+err.message)}
}
function exportData(){let blob=new Blob([JSON.stringify({format:'fire-finance-v1',exportedAt:new Date().toISOString(),events:db.events},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FIRE_backup_'+today()+'.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(){let file=$('#importFile').files[0];if(!file)return alert('Selecione um arquivo JSON.');try{let d=JSON.parse(await file.text());if(!Array.isArray(d.events)||!d.events.every(e=>e.id&&Array.isArray(e.structures)&&Array.isArray(e.entries)))throw Error('Formato inválido');if(!confirm('Substituir TODOS os dados atuais pelo backup?'))return;db={events:d.events};save();go('events');alert('Backup restaurado!')}catch(e){alert('Não foi possível restaurar: '+e.message)}}render();
</script><script>if ("serviceWorker" in navigator && location.protocol.startsWith("http")) { window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(err=>console.warn("Offline indisponível",err))); }</script></body></html>
